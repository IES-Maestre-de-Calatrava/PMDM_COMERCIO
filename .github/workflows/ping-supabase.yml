name: Ping Supabase to Prevent Pause

on:
  schedule:
    - cron: "0 9 * * 1,4"  # Lunes (1) y jueves(4) a las 9:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: "https://lxmkwegowscwhgrfsqcw.supabase.co"
          SUPABASE_KEY: "sb_publishable_dp1PvfDxB0PuMv_hL2mKlA_XO5Yb0d1"
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
          -X GET \
          "${SUPABASE_URL}/rest/v1/tarea?select=id_tarea&limit=1" \
          -H "apikey: ${SUPABASE_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_KEY}")
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "Supabase ping OK - HTTP $response"
              else
              echo "Supabase ping FAILED - HTTP $response"
              exit 1
            fi          
